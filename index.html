<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LARP Linux</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- JetBrainsMono Nerd Font (local) so Waybar glyphs render; jsDelivr CSS as text fallback -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.2.5/index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
      @font-face {
        font-family: 'JetBrainsMono Nerd Font';
        src: url('/fonts/JetBrainsMonoNerdFont-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrainsMono Nerd Font';
        src: url('/fonts/JetBrainsMonoNerdFont-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /*
        Separate family, not an extra src url. Multiple urls in one src are
        load fallbacks, not per-glyph fallbacks, so a glyph missing from
        JetBrainsMono would render as tofu. Listing this family after it in a
        font stack gives real per-glyph fallback across the full icon set.
      */
      @font-face {
        font-family: 'Symbols Nerd Font';
        src: url('/fonts/SymbolsNerdFont-Regular.ttf') format('truetype');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
